<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE INJECTOR</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <header class="chrome" data-deck-chrome>
        <span class="chip" data-deck-menu title="Menu">CRATE</span>
        <span class="drag" data-deck-drag aria-hidden="true"></span>
        <div class="win" data-deck-window-controls aria-label="Window"></div>
      </header>

      <main class="stage">
        <form id="form" class="form" autocomplete="off">
          <label class="field">
            <span class="lab">Seal</span>
            <input
              type="password"
              id="token"
              name="token"
              value="wire-whisper"
              spellcheck="false"
            />
          </label>

          <label class="field">
            <span class="lab">Station</span>
            <select id="to" name="to">
              <option value="io">IO</option>
              <option value="ab">AB</option>
              <option value="cu">CU</option>
              <option value="dr">DR</option>
              <option value="rx">RX</option>
            </select>
          </label>

          <label class="field">
            <span class="lab">From</span>
            <input
              type="text"
              id="from"
              name="from"
              placeholder="sender label"
              maxlength="200"
            />
          </label>

          <label class="field">
            <span class="lab">Subject</span>
            <input type="text" id="subject" name="subject" maxlength="200" />
          </label>

          <label class="field">
            <span class="lab">Body</span>
            <textarea id="body" name="body" rows="6"></textarea>
          </label>

          <details class="adv">
            <summary>Wire</summary>
            <input
              type="url"
              id="endpoint"
              name="endpoint"
              value=""
              placeholder="blank = default"
              spellcheck="false"
            />
          </details>

          <div class="actions">
            <button type="submit" class="go" id="btn">PUSH</button>
            <button type="button" class="ghost" id="btn-clear">clear</button>
          </div>
        </form>

        <div id="result" class="result" hidden></div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
